<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">AI Job Hunter compass mark</title>
  <desc id="desc">A compass needle inside a rounded square, representing direction in a job search.</desc>
  <defs>
    <linearGradient id="surface" x1="18" y1="12" x2="164" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172554"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="needle" x1="60" y1="40" x2="126" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
