  </defs>
  <rect x="8" y="8" width="164" height="164" rx="42" fill="#0b1120"/>
  <rect x="18" y="18" width="144" height="144" rx="34" fill="url(#surface)"/>
  <circle cx="90" cy="90" r="55" fill="none" stroke="#c4b5fd" stroke-opacity=".42" stroke-width="2"/>
  <circle cx="90" cy="90" r="43" fill="none" stroke="#e0e7ff" stroke-opacity=".22" stroke-width="1.5"/>
